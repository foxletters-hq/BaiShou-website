name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vps-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    # 在 VPS 上的 self-hosted runner 执行，避免跨境 SSH/rsync
    runs-on: [self-hosted, linux, x64, baishou-website]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build with Astro
        env:
          PUBLIC_UMAMI_SCRIPT_URL: ${{ vars.PUBLIC_UMAMI_SCRIPT_URL }}
          PUBLIC_UMAMI_URL: ${{ vars.PUBLIC_UMAMI_URL }}
          PUBLIC_UMAMI_WEBSITE_ID: ${{ secrets.PUBLIC_UMAMI_WEBSITE_ID || vars.PUBLIC_UMAMI_WEBSITE_ID }}
        run: npm run build

      - name: Publish to site directory
        env:
          SITE_PATH: ${{ vars.SITE_PATH || '/opt/1panel/www/sites/foxletters.com/index' }}
        run: |
          if [ ! -d "$SITE_PATH" ]; then
            echo "::error::站点目录不存在: $SITE_PATH"
            exit 1
          fi
          rsync -a --delete dist/ "${SITE_PATH}/"
          echo "已发布到 ${SITE_PATH}"
